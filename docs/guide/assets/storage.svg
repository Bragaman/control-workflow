<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 408" role="img" aria-labelledby="title desc">
<title id="title">Данные отдельно от программы</title><desc id="desc">Программа читает config, state и bindings. State содержит задачи и отчёты, bindings хранит привязки машины. Credentials остаются в CLI провайдера.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#5a718f"/></marker></defs>
<rect width="520" height="408" rx="16" fill="#f4f7fc"/>
<g font-family="system-ui, sans-serif" text-anchor="middle" fill="#243247"><rect x="34" y="22" width="452" height="76" rx="12" fill="#e5edf9" stroke="#cbd6e5"/><text x="260" y="54" font-size="24" font-weight="650">Программа</text><text x="260" y="80" font-size="18" fill="#53657b">Бинарник и ресурсы</text><path d="M260 100v30" stroke="#5a718f" stroke-width="2" marker-end="url(#arrow)"/><rect x="34" y="134" width="452" height="76" rx="12" fill="#fff" stroke="#cbd6e5"/><text x="260" y="166" font-size="24" font-weight="650">config</text><text x="260" y="192" font-size="18" fill="#53657b">Адаптер, модели и пути</text><path d="M260 212v30" stroke="#5a718f" stroke-width="2" marker-end="url(#arrow)"/><rect x="34" y="246" width="452" height="76" rx="12" fill="#fff" stroke="#cbd6e5"/><text x="260" y="278" font-size="24" font-weight="650">state + bindings</text><text x="260" y="304" font-size="18" fill="#53657b">Задачи, отчёты и привязки машины</text><text x="260" y="370" font-size="20" fill="#53657b">Секреты — в CLI провайдера</text></g></svg>
