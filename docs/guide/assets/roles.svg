<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 456" role="img" aria-labelledby="title desc">
<title id="title">От постановки до приёмки</title><desc id="desc">Пользователь выбирает задачу. Управляющий открывает исполнителя. Исполнитель сдаёт результат. Независимое ревью проверяет работу, пользователь принимает её.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#5a718f"/></marker></defs>
<rect width="520" height="456" rx="16" fill="#f4f7fc"/>
<g font-family="system-ui, sans-serif" text-anchor="middle" fill="#243247"><rect x="34" y="22" width="452" height="76" rx="12" fill="#e5edf9" stroke="#cbd6e5"/><text x="260" y="54" font-size="24" font-weight="650">Вы</text><text x="260" y="80" font-size="18" fill="#53657b">Выбираете цель и критерии</text><path d="M260 100v30" stroke="#5a718f" stroke-width="2" marker-end="url(#arrow)"/><rect x="34" y="134" width="452" height="76" rx="12" fill="#fff" stroke="#cbd6e5"/><text x="260" y="166" font-size="24" font-weight="650">Управляющий</text><text x="260" y="192" font-size="18" fill="#53657b">Открывает выбранную задачу</text><path d="M260 212v30" stroke="#5a718f" stroke-width="2" marker-end="url(#arrow)"/><rect x="34" y="246" width="452" height="76" rx="12" fill="#fff" stroke="#cbd6e5"/><text x="260" y="278" font-size="24" font-weight="650">Исполнитель</text><text x="260" y="304" font-size="18" fill="#53657b">Выполняет работу и сохраняет отчёт</text><path d="M260 324v30" stroke="#5a718f" stroke-width="2" marker-end="url(#arrow)"/><rect x="34" y="358" width="452" height="76" rx="12" fill="#e0f2ee" stroke="#cbd6e5"/><text x="260" y="390" font-size="24" font-weight="650">Ревью → ваша приёмка</text><text x="260" y="416" font-size="18" fill="#53657b">Проверка результата и завершение</text></g></svg>
