site_name: control-workflow
site_description: Работа с агентами — от задачи до принятого результата
site_url: https://bragaman.github.io/control-workflow/
docs_dir: target/docs-src
site_dir: target/site
theme:
  name: material
  language: ru
  font: false
  icon:
    logo: material/console
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Тёмная тема
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Светлая тема
  features:
    - navigation.footer
    - navigation.top
    - search.highlight
    - content.code.copy
plugins:
  - search:
      lang: [ru, en]
markdown_extensions:
  - tables
  - attr_list
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true
extra_css:
  - docs/guide/assets/style.css
extra:
  generator: false
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
nav:
  - Обзор: README.md
  - Установка: docs/guide/installation.md
  - Первая задача: docs/guide/first-task.md
  - Работа с задачами: docs/guide/workflow.md
  - Настройки: docs/guide/settings.md
  - Справка: docs/guide/reference.md
